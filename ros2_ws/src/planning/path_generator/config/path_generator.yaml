path_generator_node:
  ros__parameters:
    # TRACKDRIVE
    trackdrive_velocity: 7.0       # m/s

    # SKIDPAD (FSG standard geometry)
    skidpad_radius: 9.125          # m
    skidpad_velocity: 5.0          # m/s
    skidpad_points: 72             # waypoints per circle (every 5 deg)
    # Fixed map reference matching WUTA-SIM/perception_simulation/tracks/skidpad.yaml.
    # The path never follows the current localization pose.
    skidpad_start_x: 0.0           # m, crossing point
    skidpad_start_y: 0.0           # m, crossing point
    skidpad_start_yaw: 0.0         # rad, entry/exit direction
    # FSAC start position: vehicle reference is 15 m before the timing line.
    # Coordinates are local to the crossing reference above.
    skidpad_entry_x: -15.0         # m
    skidpad_entry_y: 0.0           # m
    skidpad_exit_length: 25.0      # m, stop point after the fourth lap
    skidpad_braking_distance: 10.0 # m, linear deceleration before the stop
    # Runtime analysis artifact; relative paths resolve from WUTA-FSD.
    skidpad_csv_path: ros2_ws/log/trajectory/skidpad_trajectory.csv

    # ACCELERATION
    acceleration_length: 75.0      # m
    acceleration_velocity: 15.0    # m/s
