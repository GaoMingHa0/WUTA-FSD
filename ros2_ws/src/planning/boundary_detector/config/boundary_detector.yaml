boundary_detector_node:
  ros__parameters:
    # Keep this comfortably above the controller's high-speed lookahead
    # (7 m/s * ld_ratio 2.0 = 14 m) so Trackdrive does not plan from only 2-3 midpoints.
    lookahead_distance: 30.0   # m — cones within this range used for Delaunay
    desired_velocity: 7.0      # m/s — waypoint velocity (overridden by path_generator)
    local_pairing_min_streak: 10 # cycles before geometry-only pairing fallback
    # If one color is nearly missing, use local left/right pairing immediately.
    local_pairing_color_imbalance_ratio: 0.20
