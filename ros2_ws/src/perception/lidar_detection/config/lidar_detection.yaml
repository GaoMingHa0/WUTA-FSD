# 实车M1检测参数。由模块化硬件launch直接加载，不再被固定阈值覆盖。
# 仿真地面滤波在仿真入口显式覆盖，不修改此文件。
lidar_detection_node:
  ros__parameters:
    detector_type: traditional
    input_topic: /rslidar_points
    output_topic: /perception/lidar/cones_raw
    visualization_tf_timeout_sec: 0.1
    use_ransac: true
    ground_z_threshold: -0.95
    ransac_distance_threshold: 0.08
    ground_max_tilt_deg: 5.0
    voxel_leaf_size: 0.08
    cluster_tolerance: 0.4
    min_cluster_size: 3
    max_cluster_size: 200
    max_cone_width: 0.5
    max_cone_height: 0.6
    min_cone_height: 0.1
    max_detection_range: 20.0
    voxel_before_ground: true
    ransac_max_iterations: 500
    ransac_probability: 0.999
    profile_stages: false
