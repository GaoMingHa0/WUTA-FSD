cone_map_builder:
  ros__parameters:
    # Cone merging: keep this below tight-corner cone spacing. A large radius
    # (for example 1.2 m) can merge neighbouring cones in Trackdrive hairpins
    # and make the online centerline disappear or fold back.
    merge_distance: 0.5         # m

    # Only publish cones seen at least this many times (noise filter)
    min_hit_count: 2

    # Loop closure detection
    loop_closure_distance: 3.0  # m — distance back to start position
    min_cones_for_closure: 10   # Minimum confirmed cones before checking closure
    start_skip_distance: 30.0   # m — accumulated travel required before closure
    loop_closure_heading_tolerance_deg: 60.0 # require start-direction agreement

    # Color heuristic: preserve upstream blue/yellow/orange colors, and only
    # assign blue=left/yellow=right when a detection arrives as UNKNOWN.
    # Set false once camera/detection_fusion provides complete colors.
    assign_colors: true

    # Sensor messages retain acquisition timestamps. Only the TF at that
    # timestamp is valid for map integration; missing transforms are queued
    # briefly and retried instead of using a motion-biased latest TF.
    tf_lookup_timeout_sec: 0.1
    use_latest_tf_fallback: false
    pending_detection_timeout_sec: 0.5
    max_pending_detections: 20

    # Path to save cone map YAML when loop is closed
    map_save_path: "/tmp/wuta_cone_map.yaml"
