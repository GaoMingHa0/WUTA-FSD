can_interface:
  ros__parameters:
    # ---------- 通信接口 ----------
    can:
      device: "can0"              # SocketCAN 接口名（真实 ZLG 硬件经 zlgcan_bridge 桥接为 can0）
      poll_interval_sec: 0.02     # s，接收轮询周期

    # ---------- CAN 报文 ----------
    # 每帧可配报文 ID；发送帧另可配周期发送间隔（period_sec <= 0 关闭周期发送）
    frames:
      control:                    # 工控机→VCU 控制帧
        id: 0x210
        period_sec: 0.1           # s，周期发送间隔
      heartbeat:                  # 工控机→VCU 上线心跳帧
        id: 0x301
        period_sec: 0.05          # s，周期发送间隔
      vcu:                        # VCU→工控机 AMI模式帧
        id: 0x501
      vcu_state:                  # VCU→工控机 整车状态帧（Byte1=State）
        id: 0x211
      res:                        # RES→工控机 发车/急停帧
        id: 0x1E4

    # ---------- 发车保险 ----------
    # 仅当 0x211 Byte1 出现 7→8（无人自检完成）并等待 wait_sec 后，才转发 0x1E4 的 GO。
    # 此前按下的 GO 直接丢弃（不挂起、不重放）；急停不受影响。
    go_gate:
      enabled: true               # 台架 VCU 不发 0x211 时可置 false 关闭该层
      wait_sec: 5.0               # 7→8 跳变后的等待时间
      stale_sec: 1.0              # 超过该时间未收到 0x211 即关门；<=0 关闭该检查

    # ---------- 横向定标 ----------
    steer:
      max_steer_angle: 28.0       # deg，Signal2 满量程前轮转角。注意：须与 controller vehicle.max_steer_angle 一致

    # ---------- 模式保活重发 ----------
    mode_repeat_period_sec: 1.0   # s，mission_mode_cmd 保活（确保FSD收到任务模式）重发周期（<=0 关闭）

    # 桥当前会话的模式恢复；仅模式，不恢复 RES GO/急停
    mode_cache:
      enabled: true
      directory: /run/zlgcan_bridge
      bootstrap_wait_sec: 2.0
      max_age_sec: 0.0  # 0=同一存活桥会话不按年龄过期，不代表VCU在线
